name: API documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check header coverage
        run: |
          python3 docs/api/check_headers.py
          python3 tests/unit/check_headers_test.py
      - name: Build documentation image
        run: docker build -f docs/api/Dockerfile -t beatglass-docs .
      - name: Build documentation
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" beatglass-docs sphinx-build --keep-going -b html -c docs/api . /work/build/docs/html
      - name: Move API landing page to artifact root
        run: python3 docs/api/flatten_site.py build/docs/html
      - name: Check rendered declarations
        run: python3 docs/api/check_rendered.py build/docs/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/docs/html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
