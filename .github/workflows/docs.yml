name: API documentation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check header coverage
        run: |
          python3 docs/api/check_headers.py
          python3 tests/unit/check_headers_test.py
      - name: Install documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 python3-venv python3-pip pkg-config qt6-base-dev ca-certificates
          python3 -m venv "$RUNNER_TEMP/beatglass-docs"
          "$RUNNER_TEMP/beatglass-docs/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/beatglass-docs/bin/pip" install -r docs/api/requirements.txt
      - name: Build documentation
        run: "$RUNNER_TEMP/beatglass-docs/bin/sphinx-build --keep-going -b html -c docs/api . build/docs/html"
      - name: Move API landing page to artifact root
        run: python3 docs/api/flatten_site.py build/docs/html
      - name: Check rendered declarations
        run: python3 docs/api/check_rendered.py build/docs/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/docs/html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
