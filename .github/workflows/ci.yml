name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  slice-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libaubio-dev libsndfile1-dev qt6-declarative-dev libgl1-mesa-dev qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_SLICE=ON -DBEATGLASS_BUILD_DESKTOP=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  pipewire-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev pipewire pipewire-bin wireplumber dbus libaubio-dev libsndfile1-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_PIPEWIRE=ON -DBEATGLASS_TEST_PIPEWIRE_GRAPH=ON -DBEATGLASS_BUILD_SLICE=ON -DBEATGLASS_TEST_V1_CODECS=OFF
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
