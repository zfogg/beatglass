name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  slice-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libaubio-dev libsndfile1-dev libsqlite3-dev libssl-dev qt6-declarative-dev libgl1-mesa-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_SLICE=ON -DBEATGLASS_BUILD_DESKTOP=ON -DBEATGLASS_BUILD_LIBRARY_PROTOTYPE=ON -DBEATGLASS_BUILD_LIBRARY_FINGERPRINT=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  library-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_LIBRARY_PROTOTYPE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
