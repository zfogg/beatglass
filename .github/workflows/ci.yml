name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_TESTING=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  slice-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libaubio-dev libsndfile1-dev libsqlite3-dev libssl-dev qt6-declarative-dev libgl1-mesa-dev qml6-module-qt-labs-folderlistmodel qml6-module-qtqml qml6-module-qtqml-models qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_SLICE=ON -DBEATGLASS_BUILD_DESKTOP=ON -DBEATGLASS_BUILD_LIBRARY_PROTOTYPE=ON -DBEATGLASS_BUILD_LIBRARY_FINGERPRINT=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  library-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_LIBRARY_PROTOTYPE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  windows-overlay:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "${{ runner.temp }}/qt" --archives qtbase qtdeclarative qtshadertools
      - run: cmake -S . -B build-overlay -DBUILD_TESTING=ON -DBEATGLASS_BUILD_WINDOWS_OVERLAY_TESTS=ON -DCMAKE_PREFIX_PATH="${{ runner.temp }}/qt/6.8.3/msvc2022_64"
      - run: cmake --build build-overlay --config Debug --target windows_overlay_tests
      - run: ctest --test-dir build-overlay -C Debug -R '^windows_overlay$' --output-on-failure

  pipewire-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DBEATGLASS_BUILD_PIPEWIRE=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
