<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Overlay qualification matrix</title>
  <desc id="desc">A matrix mapping ready, recovery, and disconnected states to Linux, macOS, and Windows native evidence.</desc>
  <rect width="900" height="340" rx="22" fill="#0f172a"/><text x="42" y="48" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Native qualification matrix</text>
  <g font-family="sans-serif" font-size="15"><rect x="42" y="76" width="816" height="48" rx="8" fill="#334155"/><text x="450" y="100" fill="#cbd5e1" font-weight="700" text-anchor="middle" dominant-baseline="middle">State</text><text x="300" y="106" fill="#cbd5e1" font-weight="700">Linux</text><text x="510" y="106" fill="#cbd5e1" font-weight="700">macOS</text><text x="720" y="106" fill="#cbd5e1" font-weight="700">Windows</text>
  <rect x="42" y="134" width="816" height="48" rx="8" fill="#163b2b"/><text x="450" y="158" fill="#bbf7d0" text-anchor="middle" dominant-baseline="middle">Ready overlay</text><text x="300" y="164" fill="#d1fae5">desktop screenshot</text><text x="510" y="164" fill="#d1fae5">desktop screenshot</text><text x="720" y="164" fill="#d1fae5">desktop screenshot</text>
  <rect x="42" y="192" width="816" height="48" rx="8" fill="#3b2f12"/><text x="450" y="216" fill="#fde68a" text-anchor="middle" dominant-baseline="middle">Recovery pending</text><text x="300" y="222" fill="#fef3c7">loss + restore</text><text x="510" y="222" fill="#fef3c7">loss + restore</text><text x="720" y="222" fill="#fef3c7">loss + restore</text>
  <rect x="42" y="250" width="816" height="48" rx="8" fill="#3f1d2e"/><text x="68" y="280" fill="#fecdd3">Disconnected</text><text x="300" y="280" fill="#ffe4e6">reconnect + retry</text><text x="510" y="280" fill="#ffe4e6">reconnect + retry</text><text x="720" y="280" fill="#ffe4e6">reconnect + retry</text></g>
</svg>
