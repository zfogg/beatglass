<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Native overlay restore paused</title>
  <desc id="desc">A safe-mode state explains that display restoration attempts are exhausted while monitoring continues without the native window.</desc>
  <rect width="920" height="560" rx="28" fill="#0b1220"/>
  <rect x="56" y="52" width="808" height="456" rx="22" fill="#111c31" stroke="#30415f" stroke-width="2"/>
  <circle cx="116" cy="116" r="28" fill="#f2b84b"/>
  <path d="M110 103v26M122 103v26" stroke="#231a08" stroke-width="6" stroke-linecap="round"/>
  <text x="168" y="111" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Safe mode is active</text>
  <text x="168" y="142" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="17">Display restoration is paused after three attempts.</text>
  <rect x="96" y="190" width="728" height="104" rx="16" fill="#17243c"/>
  <text x="124" y="226" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Monitoring is still available</text>
  <text x="124" y="258" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="16">Capture continues without a native overlay window.</text>
  <text x="124" y="282" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="16">Saved display, size, opacity, theme, and placement remain intact.</text>
  <rect x="96" y="326" width="728" height="1" fill="#30415f"/>
  <text x="96" y="370" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="17">Reconnect Display 1, then try restoration from settings.</text>
  <text x="96" y="398" fill="#8f9db5" font-family="Inter,Arial,sans-serif" font-size="16">You can keep monitoring or dismiss this notice for now.</text>
  <rect x="96" y="438" width="214" height="46" rx="12" fill="#6ca8ff"/>
  <text x="203" y="468" text-anchor="middle" fill="#08141a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Open settings</text>
  <rect x="328" y="438" width="154" height="46" rx="12" fill="#22324d" stroke="#506487"/>
  <text x="405" y="468" text-anchor="middle" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="16">Dismiss</text>
</svg>
