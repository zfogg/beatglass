<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay click-through control</title><desc id="desc">A click-through setting with explicit interaction and unlock guidance.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Mouse interaction</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Choose whether the overlay receives clicks while you work.</text><rect x="168" y="220" width="624" height="92" rx="14" fill="#101827"/><text x="192" y="254" fill="#f7fafc" font-family="sans-serif" font-size="18" font-weight="700">Click-through mode</text><text x="192" y="282" fill="#a7b4c9" font-family="sans-serif" font-size="14">Passes clicks to the app underneath</text><rect x="708" y="244" width="52" height="28" rx="14" fill="#56d38b"/><circle cx="746" cy="258" r="10" fill="#07130d"/><text x="168" y="366" fill="#d8e3f5" font-family="sans-serif" font-size="16">Overlay is currently click-through</text><text x="168" y="394" fill="#a7b4c9" font-family="sans-serif" font-size="15">Use the unlock shortcut to interact with controls.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Apply</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Interaction</text></svg>
