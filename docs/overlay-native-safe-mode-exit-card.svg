<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><title>Exit native overlay safe mode</title><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Resume native overlay?</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Native permission is available again. Restore your saved overlay state.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">RESTORE PLAN</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Display · theme · layout · opacity</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Settings saved while safe mode was active will be applied.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Playback and capture will continue</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">You can stay in safe mode if you prefer.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">Resume overlay</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Stay safe</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Native window</text></svg>
