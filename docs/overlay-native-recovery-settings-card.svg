<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Native overlay recovery settings</title>
  <desc id="desc">Recovery settings expose the selected display and safe-mode choice while keeping the live session running.</desc>
  <rect width="920" height="560" rx="28" fill="#0b1220"/>
  <rect x="56" y="52" width="808" height="456" rx="22" fill="#111c31" stroke="#30415f" stroke-width="2"/>
  <text x="96" y="112" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Overlay recovery</text>
  <text x="96" y="144" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="17">Choose how Beatglass should recover the native window.</text>
  <rect x="96" y="182" width="728" height="78" rx="14" fill="#17243c"/>
  <text x="124" y="218" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="14">PREFERRED DISPLAY</text>
  <text x="124" y="244" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Display 1 · External monitor</text>
  <rect x="96" y="278" width="728" height="78" rx="14" fill="#1b3550" stroke="#6ca8ff" stroke-width="2"/>
  <circle cx="124" cy="317" r="9" fill="#6ca8ff"/>
  <text x="150" y="314" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Try automatically when available</text>
  <text x="150" y="338" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="15">Keep safe mode active if recovery fails.</text>
  <rect x="96" y="374" width="728" height="1" fill="#30415f"/>
  <text x="96" y="412" fill="#8f9db5" font-family="Inter,Arial,sans-serif" font-size="16">Current monitoring continues · appearance and capture settings are retained.</text>
  <rect x="96" y="438" width="172" height="46" rx="12" fill="#6ca8ff"/>
  <text x="182" y="468" text-anchor="middle" fill="#08141a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Save recovery</text>
  <rect x="286" y="438" width="154" height="46" rx="12" fill="#22324d" stroke="#506487"/>
  <text x="363" y="468" text-anchor="middle" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="16">Cancel</text>
</svg>
