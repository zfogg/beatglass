<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay activation pending</title><desc id="desc">A transient native activation state while the overlay window is being shown.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><circle cx="184" cy="151" r="28" fill="#3e3421"/><circle cx="184" cy="151" r="11" fill="none" stroke="#ffd36e" stroke-width="4"/><path d="M184 132v8m0 22v8m19-19h-8m-22 0h-8" stroke="#ffd36e" stroke-width="3" stroke-linecap="round"/><text x="232" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Showing overlay…</text><text x="232" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">The native window is activating on your selected display.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">ACTIVATION</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Display 1 · Bottom · Click-through</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Restoring your saved overlay state.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">This should only take a moment</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Playback and capture continue normally.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="239" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Activation</text></svg>
