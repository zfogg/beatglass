<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Overlay display control card</title>
  <desc id="desc">A display selection card with a selected display and an unavailable display option.</desc>
  <rect width="760" height="330" rx="22" fill="#0f172a"/>
  <rect x="32" y="28" width="696" height="274" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Overlay display</text>
  <text x="60" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="14">Choose where the persisted overlay should appear.</text>
  <rect x="60" y="148" width="300" height="62" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="84" y="176" fill="#eff6ff" font-family="sans-serif" font-size="16" font-weight="700">Studio Monitor · selected</text><text x="84" y="197" fill="#dbeafe" font-family="sans-serif" font-size="13">Available</text>
  <rect x="390" y="148" width="300" height="62" rx="10" fill="#3f1d2e" stroke="#fb7185"/><text x="414" y="176" fill="#fecdd3" font-family="sans-serif" font-size="16" font-weight="700">Projector</text><text x="414" y="197" fill="#ffe4e6" font-family="sans-serif" font-size="13">Unavailable · choose another</text>
  <text x="60" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13">Selection persists with size, opacity, and interaction settings.</text>
</svg>
