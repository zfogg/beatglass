<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Overlay keyboard shortcuts card</title>
  <desc id="desc">A card listing shortcuts for showing, hiding, and reviewing overlay recovery.</desc>
  <rect width="760" height="320" rx="22" fill="#0f172a"/><rect x="32" y="28" width="696" height="264" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Overlay shortcuts</text>
  <text x="60" y="124" fill="#cbd5e1" font-family="sans-serif" font-size="15">Show overlay</text><rect x="300" y="100" width="138" height="38" rx="8" fill="#334155" stroke="#94a3b8"/><text x="369" y="119" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Ctrl+Alt+W</text>
  <text x="60" y="178" fill="#cbd5e1" font-family="sans-serif" font-size="15">Hide overlay</text><rect x="300" y="154" width="138" height="38" rx="8" fill="#334155" stroke="#94a3b8"/><text x="369" y="173" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Ctrl+Alt+J</text>
  <text x="60" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="15">Review recovery</text><rect x="300" y="208" width="138" height="38" rx="8" fill="#2563eb"/><text x="369" y="227" fill="#eff6ff" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">Ctrl+Alt+R</text>
  <text x="474" y="232" fill="#94a3b8" font-family="sans-serif" font-size="13">Same labels in keyboard and pointer workflows.</text>
</svg>
