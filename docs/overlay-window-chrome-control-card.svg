<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><title>Overlay window chrome control</title><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Window chrome</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Choose how much of the native frame surrounds the overlay.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">CURRENT STYLE</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Borderless overlay</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Keeps the native frame out of the way while performing.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Native controls stay available through the tray</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Changing this setting does not move or resize the overlay.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Apply</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Reset</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Appearance</text></svg>
