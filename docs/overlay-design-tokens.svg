<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Overlay recovery design tokens</title>
  <desc id="desc">Ready, recovery, and disconnected color tokens with their next actions.</desc>
  <rect width="900" height="260" rx="20" fill="#111827"/>
  <text x="36" y="42" fill="#f9fafb" font-family="sans-serif" font-size="23" font-weight="700">State-first recovery tokens</text>
  <g font-family="sans-serif"><rect x="36" y="74" width="250" height="120" rx="14" fill="#163b2b" stroke="#4ade80" stroke-width="2"/><text x="161" y="134" fill="#bbf7d0" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">READY · #4ADE80</text><text x="58" y="138" fill="#f9fafb" font-size="15">Settings applied</text><text x="58" y="168" fill="#d1fae5" font-size="14">Restore overlay</text>
  <rect x="325" y="74" width="250" height="120" rx="14" fill="#3b2f12" stroke="#fbbf24" stroke-width="2"/><text x="450" y="134" fill="#fde68a" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">RECOVERY · #FBBF24</text><text x="347" y="138" fill="#f9fafb" font-size="15">Settings retained</text><text x="347" y="168" fill="#fef3c7" font-size="14">Review recovery</text>
  <rect x="614" y="74" width="250" height="120" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/><text x="636" y="108" fill="#fecdd3" font-size="16" font-weight="700">DISCONNECTED · #FB7185</text><text x="636" y="138" fill="#f9fafb" font-size="15">Display unavailable</text><text x="636" y="168" fill="#ffe4e6" font-size="14">Retry overlay</text></g>
  <text x="36" y="230" fill="#9ca3af" font-family="sans-serif" font-size="13">One status · one next action · one accessible announcement.</text>
</svg>
