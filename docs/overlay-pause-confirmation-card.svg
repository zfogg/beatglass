<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / PAUSE</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Pause monitoring?</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">The overlay will stay visible while audio capture pauses.</text>
  <rect x="112" y="258" width="976" height="168" rx="18" fill="#202938"/><circle cx="174" cy="340" r="38" fill="#e3b45b"/><rect x="162" y="318" width="10" height="44" rx="5" fill="#10131a"/><rect x="180" y="318" width="10" height="44" rx="5" fill="#10131a"/><text x="244" y="320" fill="#f2f6fb" font-family="Inter,Arial" font-size="24" font-weight="700">What will happen</text><text x="244" y="358" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">No audio will be captured until you resume.</text><text x="244" y="388" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Position, size, and opacity remain unchanged.</text>
  <text x="112" y="480" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">You can resume any time</text>
  <text x="112" y="516" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Use the overlay action or Ctrl + Shift + P to start listening again.</text>
  <rect x="112" y="594" width="180" height="58" rx="14" fill="#e3b45b"/><text x="202" y="623" fill="#10131a" font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Pause now</text><rect x="314" y="594" width="180" height="58" rx="14" fill="#2a3444"/><text x="404" y="630" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Keep listening</text>
</svg>
