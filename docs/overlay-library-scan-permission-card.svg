<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Library folder permission overlay</title>
  <desc id="desc">A clear permission request for a library folder with privacy-safe choices.</desc>
  <rect width="960" height="600" fill="#0b1220"/>
  <rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/>
  <circle cx="184" cy="151" r="28" fill="#2a3b63"/><path d="M174 150h20m-10-10v20" stroke="#7db4ff" stroke-width="5" stroke-linecap="round"/>
  <text x="232" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Folder access needed</text>
  <text x="232" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Beatglass needs permission to scan this library folder.</text>
  <rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/>
  <text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">FOLDER</text>
  <text x="192" y="285" fill="#f7fafc" font-family="sans-serif" font-size="21" font-weight="700">Music / DJ Library</text>
  <text x="192" y="309" fill="#718096" font-family="sans-serif" font-size="14">Read-only indexing · no files are modified</text>
  <text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Choose how to continue</text>
  <text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">You can change this permission later in settings.</text>
  <rect x="168" y="438" width="180" height="48" rx="12" fill="#56d38b"/><text x="258" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Allow folder</text>
  <rect x="364" y="438" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="438" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Not now</text>
  <text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Library</text>
</svg>
