<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Overlay size control card</title>
  <desc id="desc">A settings card showing compact, medium, and large overlay size presets with medium selected.</desc>
  <rect width="760" height="330" rx="22" fill="#0f172a"/>
  <rect x="32" y="28" width="696" height="274" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Overlay size</text>
  <text x="60" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="14">Choose a preset; dimensions are announced with the selection.</text>
  <rect x="60" y="148" width="180" height="62" rx="10" fill="#334155" stroke="#64748b"/><text x="150" y="179" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">Compact</text><text x="87" y="197" fill="#cbd5e1" font-family="sans-serif" font-size="13">250 × 110</text>
  <rect x="290" y="148" width="180" height="62" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/><text x="322" y="176" fill="#eff6ff" font-family="sans-serif" font-size="16" font-weight="700">Medium · selected</text><text x="322" y="197" fill="#dbeafe" font-family="sans-serif" font-size="13">310 × 130</text>
  <rect x="520" y="148" width="180" height="62" rx="10" fill="#334155" stroke="#64748b"/><text x="610" y="179" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">Large</text><text x="562" y="197" fill="#cbd5e1" font-family="sans-serif" font-size="13">430 × 180</text>
  <text x="60" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13">Selection persists with the display and opacity settings.</text>
</svg>
