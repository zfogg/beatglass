<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / QUICK ACTIONS</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Quick actions</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Keep the most important overlay controls one click away.</text>
  <rect x="112" y="258" width="466" height="132" rx="18" fill="#202938"/><circle cx="158" cy="304" r="18" fill="#56d38b"/><text x="202" y="311" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Show / hide overlay</text><text x="202" y="345" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Toggle visibility without changing state.</text><text x="538" y="335" fill="#9ba9bb" font-family="Inter,Arial" font-size="15" text-anchor="end">Ctrl + Shift + H</text>
  <rect x="622" y="258" width="466" height="132" rx="18" fill="#202938"/><circle cx="668" cy="304" r="18" fill="#56d38b"/><text x="712" y="311" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Unlock interactions</text><text x="712" y="345" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Temporarily accept pointer input.</text><text x="1048" y="335" fill="#9ba9bb" font-family="Inter,Arial" font-size="15" text-anchor="end">Ctrl + Shift + U</text>
  <rect x="112" y="424" width="466" height="132" rx="18" fill="#202938"/><circle cx="158" cy="470" r="18" fill="#56d38b"/><text x="202" y="477" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Open controls</text><text x="202" y="511" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Adjust output, size, and placement.</text><text x="538" y="501" fill="#9ba9bb" font-family="Inter,Arial" font-size="15" text-anchor="end">Ctrl + Shift + O</text>
  <rect x="622" y="424" width="466" height="132" rx="18" fill="#202938"/><circle cx="668" cy="470" r="18" fill="#56d38b"/><text x="712" y="477" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Pause monitoring</text><text x="712" y="511" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Keep the layout while stopping capture.</text><text x="1048" y="501" fill="#9ba9bb" font-family="Inter,Arial" font-size="15" text-anchor="end">Ctrl + Shift + P</text>
  <rect x="112" y="600" width="976" height="62" rx="16" fill="#202938"/><text x="144" y="639" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Shortcuts are available from the overlay menu.</text><text x="1048" y="639" fill="#56d38b" font-family="Inter,Arial" font-size="16" font-weight="700" text-anchor="end">View all shortcuts</text>
</svg>
