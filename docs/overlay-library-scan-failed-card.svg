<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Library scan failed overlay</title>
  <desc id="desc">A recoverable library indexing failure that preserves existing tracks and offers retry or diagnostics.</desc>
  <rect width="960" height="600" fill="#0b1220"/>
  <rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/>
  <circle cx="184" cy="151" r="28" fill="#5b2630"/><path d="M173 140l22 22m0-22l-22 22" stroke="#ff7f86" stroke-width="5" stroke-linecap="round"/>
  <text x="232" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Library scan failed</text>
  <text x="232" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Existing tracks are safe. No files were changed.</text>
  <rect x="168" y="220" width="624" height="96" rx="14" fill="#101827"/>
  <text x="192" y="252" fill="#a7b4c9" font-family="sans-serif" font-size="15">INDEXING STATUS</text>
  <text x="192" y="284" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Stopped after 128 of 214 tracks</text>
  <text x="192" y="307" fill="#a7b4c9" font-family="sans-serif" font-size="14">The source folder is still available to retry.</text>
  <text x="168" y="363" fill="#ffb0b4" font-family="sans-serif" font-size="16">Could not read one or more files.</text>
  <text x="168" y="390" fill="#a7b4c9" font-family="sans-serif" font-size="15">Check the folder permissions or review diagnostics.</text>
  <rect x="168" y="438" width="148" height="48" rx="12" fill="#56d38b"/><text x="242" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Retry scan</text>
  <rect x="332" y="438" width="168" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="416" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">View diagnostics</text>
  <text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Library</text>
</svg>
