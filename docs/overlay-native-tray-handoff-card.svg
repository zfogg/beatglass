<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Return to native overlay from tray</title>
  <desc id="desc">A tray handoff prompt that explains the overlay is still monitoring and offers a return action without restarting capture.</desc>
  <rect width="920" height="560" rx="28" fill="#0b1220"/>
  <rect x="56" y="52" width="808" height="456" rx="22" fill="#111c31" stroke="#30415f" stroke-width="2"/>
  <circle cx="116" cy="116" r="28" fill="#6ca8ff"/>
  <path d="M104 116h24M116 104v24" stroke="#08141a" stroke-width="5" stroke-linecap="round"/>
  <text x="168" y="111" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Overlay is in the tray</text>
  <text x="168" y="142" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="17">Monitoring continues while the window is hidden.</text>
  <rect x="96" y="190" width="728" height="104" rx="16" fill="#17243c"/>
  <text x="124" y="226" fill="#f4f7fb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Session retained</text>
  <text x="124" y="258" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="16">Display 2 · Bottom-right · 82% opacity · click-through on</text>
  <text x="124" y="282" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="16">Last level −12 dBFS · shortcut Ctrl+Shift+O</text>
  <rect x="96" y="326" width="728" height="1" fill="#30415f"/>
  <text x="96" y="370" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="17">Bring it back whenever you need the visual readout.</text>
  <text x="96" y="398" fill="#8f9db5" font-family="Inter,Arial,sans-serif" font-size="16">Returning to the overlay does not restart capture or change settings.</text>
  <rect x="96" y="438" width="226" height="46" rx="12" fill="#6ca8ff"/>
  <text x="209" y="468" text-anchor="middle" fill="#08141a" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Show overlay</text>
  <rect x="340" y="438" width="154" height="46" rx="12" fill="#22324d" stroke="#506487"/>
  <text x="417" y="468" text-anchor="middle" fill="#dbe7f6" font-family="Inter,Arial,sans-serif" font-size="16">Keep hidden</text>
</svg>
