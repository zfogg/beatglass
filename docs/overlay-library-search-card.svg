  <text x="112" y="494" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">Selected track</text><text x="112" y="530" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Choose a result to open its waveform and analysis views.</text>
