  <rect x="112" y="258" width="976" height="62" rx="14" fill="#202938" stroke="#56d38b" stroke-width="2"/><text x="144" y="297" fill="#f2f6fb" font-family="Inter,Arial" font-size="19">Search title, artist, or folder…</text><text x="1048" y="297" fill="#7f8da0" font-family="Inter,Arial" font-size="15" text-anchor="end">Ctrl + L</text>
