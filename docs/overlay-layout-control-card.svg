<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay layout control</title><desc id="desc">A layout control showing position and size presets with a desktop preview.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Overlay layout</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Place the overlay where it stays visible during a set.</text><rect x="168" y="220" width="300" height="112" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">POSITION</text><rect x="192" y="270" width="68" height="40" rx="8" fill="#24344f"/><text x="226" y="296" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="14">Top</text><rect x="270" y="270" width="82" height="40" rx="8" fill="#56d38b"/><text x="311" y="290" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="14" font-weight="700" dominant-baseline="middle">Bottom</text><rect x="362" y="270" width="82" height="40" rx="8" fill="#24344f"/><text x="403" y="296" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="14">Right</text><rect x="496" y="220" width="296" height="112" rx="14" fill="#101827"/><text x="520" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">SIZE</text><text x="520" y="291" fill="#f7fafc" font-family="sans-serif" font-size="20" font-weight="700">Compact · 360 px</text><text x="520" y="314" fill="#a7b4c9" font-family="sans-serif" font-size="14">Preview updates immediately</text><text x="168" y="378" fill="#d8e3f5" font-family="sans-serif" font-size="16">Desktop preview</text><rect x="168" y="394" width="380" height="52" rx="8" fill="#0e1727" stroke="#2d405e"/><rect x="392" y="404" width="138" height="32" rx="6" fill="#56d38b"/><text x="461" y="420" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="13" font-weight="700" dominant-baseline="middle">Overlay preview</text><rect x="168" y="466" width="142" height="40" rx="10" fill="#56d38b"/><text x="239" y="486" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">Apply layout</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Appearance</text></svg>
