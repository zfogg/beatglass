<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / ACCESS</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Allow audio access</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Beatglass needs permission to listen to your selected output.</text>
  <rect x="112" y="258" width="976" height="154" rx="18" fill="#202938"/><circle cx="174" cy="335" r="38" fill="#e3b45b"/><path d="M174 309v36M174 358v2" stroke="#10131a" stroke-width="7" stroke-linecap="round"/><text x="244" y="316" fill="#f2f6fb" font-family="Inter,Arial" font-size="24" font-weight="700">System audio permission</text><text x="244" y="353" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Needed to draw waveform and frequency activity.</text><text x="244" y="383" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">You can change this later in system settings.</text>
  <text x="112" y="478" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">What Beatglass can access</text><text x="112" y="514" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Live output samples for analysis · no file writes · local processing</text>
  <rect x="112" y="614" width="214" height="54" rx="14" fill="#56d38b"/><text x="219" y="641" fill="#10131a" font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Open settings</text><rect x="350" y="614" width="180" height="54" rx="14" fill="#2a3444"/><text x="440" y="648" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Not now</text>
