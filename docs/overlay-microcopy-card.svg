<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">Overlay microcopy card</title><desc id="desc">A card showing concise status, retained context, and next action copy.</desc><rect width="760" height="280" rx="22" fill="#0f172a"/><rect x="32" y="28" width="696" height="224" rx="18" fill="#1e293b" stroke="#475569"/><text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Microcopy hierarchy</text><text x="60" y="120" fill="#fde68a" font-family="sans-serif" font-size="17" font-weight="700">Overlay recovery pending</text><text x="60" y="154" fill="#cbd5e1" font-family="sans-serif" font-size="15">Persisted display, size, and opacity retained.</text><text x="60" y="188" fill="#94a3b8" font-family="sans-serif" font-size="14">Review settings, then restore the overlay.</text><rect x="60" y="208" width="150" height="30" rx="7" fill="#2563eb"/><text x="95" y="228" fill="#eff6ff" font-family="sans-serif" font-size="13" font-weight="700">Review recovery</text></svg>
