<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Confirm library scan overlay</title>
  <desc id="desc">A focused confirmation before scanning a library folder, showing scope, duration, and safe cancellation.</desc>
  <rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/>
  <text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Scan your library now?</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Beatglass will index changed files without modifying your audio.</text>
  <rect x="168" y="220" width="624" height="112" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">SCAN SCOPE</text><text x="192" y="285" fill="#f7fafc" font-family="sans-serif" font-size="21" font-weight="700">Music / DJ Library</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Estimated time: about 2 minutes · 214 tracks</text>
  <text x="168" y="380" fill="#d8e3f5" font-family="sans-serif" font-size="16">You can cancel safely at any time</text><text x="168" y="408" fill="#a7b4c9" font-family="sans-serif" font-size="15">Existing indexed tracks remain available if you stop.</text>
  <rect x="168" y="452" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="476" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Start scan</text><rect x="326" y="452" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="483" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Not now</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Library</text>
</svg>
