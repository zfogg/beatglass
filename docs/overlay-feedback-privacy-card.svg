<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / FEEDBACK</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Before you send</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Review what feedback includes and what stays private.</text>
  <rect x="112" y="258" width="976" height="158" rx="18" fill="#202938"/><circle cx="174" cy="337" r="38" fill="#56d38b"/><path d="M174 311l28 12v20c0 19-12 31-28 40-16-9-28-21-28-40v-20z" fill="#10131a"/><path d="M161 339l9 9 18-20" fill="none" stroke="#56d38b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="318" fill="#f2f6fb" font-family="Inter,Arial" font-size="24" font-weight="700">Your audio stays private</text><text x="244" y="355" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Only your rating and optional note are sent.</text><text x="244" y="385" fill="#56d38b" font-family="Inter,Arial" font-size="16" font-weight="700">No audio files or library data are included</text>
  <text x="112" y="478" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">You choose what to share</text><text x="112" y="514" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Feedback is optional and can be skipped without changing monitoring.</text>
  <rect x="112" y="614" width="196" height="54" rx="14" fill="#56d38b"/><text x="210" y="641" fill="#10131a" font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Continue</text><rect x="332" y="614" width="180" height="54" rx="14" fill="#2a3444"/><text x="422" y="648" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Skip</text>
</svg>
