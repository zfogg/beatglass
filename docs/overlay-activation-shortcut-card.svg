<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay activation shortcut</title><desc id="desc">An activation shortcut editor showing the current shortcut and conflict guidance.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Activation shortcut</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Show or hide the overlay without leaving your music app.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">CURRENT SHORTCUT</text><rect x="192" y="270" width="220" height="38" rx="8" fill="#24344f" stroke="#56d38b"/><text x="302" y="295" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="17" font-weight="700">Ctrl + Shift + B</text><text x="438" y="294" fill="#7ff0c4" font-family="sans-serif" font-size="14">Available</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Press a new key combination to change it</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Shortcuts are saved locally and checked for conflicts.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Change</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Reset</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Shortcuts</text></svg>
