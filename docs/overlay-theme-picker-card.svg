<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay theme picker</title><desc id="desc">A theme selection surface with clear preview, contrast, and apply actions.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Overlay appearance</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Choose a theme that stays readable over your mix.</text><rect x="168" y="220" width="190" height="120" rx="14" fill="#101827" stroke="#56d38b" stroke-width="3"/><rect x="184" y="238" width="158" height="58" rx="8" fill="#172033"/><text x="263" y="274" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16" font-weight="700">Midnight</text><text x="263" y="320" text-anchor="middle" fill="#7ff0c4" font-family="sans-serif" font-size="14">Selected</text><rect x="382" y="220" width="190" height="120" rx="14" fill="#f2f5f9"/><text x="477" y="274" text-anchor="middle" fill="#182235" font-family="sans-serif" font-size="16" font-weight="700">Daylight</text><text x="477" y="320" text-anchor="middle" fill="#53657c" font-family="sans-serif" font-size="14">Preview</text><rect x="596" y="220" width="190" height="120" rx="14" fill="#251e3e"/><text x="691" y="274" text-anchor="middle" fill="#f3edff" font-family="sans-serif" font-size="16" font-weight="700">Plum</text><text x="691" y="320" text-anchor="middle" fill="#bfa5ff" font-family="sans-serif" font-size="14">Preview</text><text x="168" y="388" fill="#d8e3f5" font-family="sans-serif" font-size="16">Contrast check passed</text><text x="168" y="416" fill="#a7b4c9" font-family="sans-serif" font-size="15">Text and controls remain readable in every theme.</text><rect x="168" y="452" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="476" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Apply theme</text><rect x="326" y="452" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="483" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Appearance</text></svg>
