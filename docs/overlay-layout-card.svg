<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Overlay layout hierarchy card</title><desc id="desc">A layout card showing consistent spacing between state, summary, and next action.</desc><rect width="760" height="300" rx="22" fill="#0f172a"/><rect x="32" y="28" width="696" height="244" rx="18" fill="#1e293b" stroke="#475569"/><text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Layout hierarchy</text><rect x="60" y="98" width="620" height="34" rx="8" fill="#3b2f12"/><text x="370" y="115" fill="#fde68a" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">STATE · RECOVERY PENDING</text><rect x="60" y="148" width="390" height="42" rx="8" fill="#334155"/><text x="255" y="169" fill="#f8fafc" font-family="sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Retained display · size · opacity</text><rect x="60" y="208" width="190" height="42" rx="8" fill="#2563eb"/><text x="155" y="229" fill="#eff6ff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">Next action</text><text x="274" y="234" fill="#94a3b8" font-family="sans-serif" font-size="13">24px rhythm · one primary action</text></svg>
