  <rect x="112" y="258" width="976" height="152" rx="18" fill="#202938"/><rect x="144" y="297" width="74" height="74" rx="18" fill="#2a3444"/><path d="M164 334h34M181 317v34" stroke="#56d38b" stroke-width="6" stroke-linecap="round"/><text x="254" y="318" fill="#f2f6fb" font-family="Inter,Arial" font-size="23" font-weight="700">Live monitoring is on</text><text x="254" y="354" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Built-in Speakers · 48 kHz · 12 ms latency</text><text x="254" y="382" fill="#56d38b" font-family="Inter,Arial" font-size="16" font-weight="700">0 dropped frames</text>
