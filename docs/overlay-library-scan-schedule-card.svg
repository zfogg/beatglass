<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Library scan schedule settings overlay</title>
  <desc id="desc">A compact schedule control showing incremental scanning and a clear save action.</desc>
  <rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/>
  <text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Library scan schedule</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Keep indexing predictable without interrupting playback.</text>
  <rect x="168" y="220" width="624" height="72" rx="14" fill="#101827"/><text x="192" y="250" fill="#f7fafc" font-family="sans-serif" font-size="17" font-weight="700">Automatic scans</text><text x="192" y="274" fill="#a7b4c9" font-family="sans-serif" font-size="14">Enabled · next run tomorrow at 03:00</text><rect x="708" y="242" width="52" height="28" rx="14" fill="#56d38b"/><circle cx="746" cy="256" r="10" fill="#07130d"/>
  <text x="168" y="346" fill="#d8e3f5" font-family="sans-serif" font-size="16">Scan frequency</text><rect x="168" y="364" width="260" height="48" rx="10" fill="#24344f" stroke="#3b4d6d"/><text x="192" y="395" fill="#f7fafc" font-family="sans-serif" font-size="16">Every 24 hours</text><text x="168" y="445" fill="#a7b4c9" font-family="sans-serif" font-size="14">Only changed files are read; audio files are never modified.</text>
  <rect x="168" y="466" width="142" height="40" rx="10" fill="#56d38b"/><text x="239" y="486" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">Save schedule</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Library settings</text>
</svg>
