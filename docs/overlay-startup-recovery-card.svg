<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay startup recovery</title><desc id="desc">Startup restoration of the saved native overlay state.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Restoring overlay</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Reconnecting to your last display and appearance.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">STARTUP RECOVERY</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Display 1 · Midnight · Bottom</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Restoring saved native window state.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Your session is safe while this completes</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Playback, capture, and library indexing continue.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="239" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Startup</text></svg>
