<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay click-through applied</title><desc id="desc">A confirmation of click-through mode with the unlock shortcut surfaced.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><circle cx="184" cy="151" r="28" fill="#214b46"/><path d="M171 151l9 9 18-20" fill="none" stroke="#7ff0c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="232" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Click-through enabled</text><text x="232" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Clicks now pass safely to the app underneath.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">UNLOCK SHORTCUT</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Ctrl + Shift + U</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Hold the shortcut to interact with overlay controls.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Need to change a setting?</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Unlock temporarily, then click through again.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Done</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Change</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Interaction</text></svg>
