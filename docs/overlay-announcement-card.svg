<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Overlay recovery announcement card</title>
  <desc id="desc">An announcement card showing a recovery message and its matching status metadata.</desc>
  <rect width="760" height="280" rx="22" fill="#0f172a"/>
  <rect x="32" y="28" width="696" height="224" rx="18" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Recovery announcement</text>
  <rect x="60" y="96" width="600" height="58" rx="10" fill="#3b2f12" stroke="#fbbf24"/><text x="360" y="125" fill="#fef3c7" font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">Overlay recovery pending; persisted settings retained.</text>
  <text x="60" y="194" fill="#cbd5e1" font-family="sans-serif" font-size="14">Status: recovery pending · revision 12 · next action: Review recovery</text>
  <text x="60" y="224" fill="#94a3b8" font-family="sans-serif" font-size="13">The same state is exposed through Accessible.name, value, and description.</text>
</svg>
