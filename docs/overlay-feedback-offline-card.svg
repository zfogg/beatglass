<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / FEEDBACK</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Feedback is offline</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Your listening session can continue. We will not block the overlay.</text>
  <rect x="112" y="258" width="976" height="158" rx="18" fill="#202938"/><circle cx="174" cy="337" r="38" fill="#718096"/><path d="M158 337h32M174 321v32" stroke="#10131a" stroke-width="6" stroke-linecap="round"/><text x="244" y="318" fill="#f2f6fb" font-family="Inter,Arial" font-size="24" font-weight="700">Nothing was sent</text><text x="244" y="355" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">We could not reach the feedback service right now.</text><text x="244" y="385" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Your rating and note remain on this device.</text>
  <text x="112" y="478" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">What you can do</text><text x="112" y="514" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Try again later, or close this message and keep working.</text>
  <rect x="112" y="614" width="180" height="54" rx="14" fill="#56d38b"/><text x="202" y="641" fill="#10131a" font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">Try again</text><rect x="314" y="614" width="180" height="54" rx="14" fill="#2a3444"/><text x="404" y="648" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Close</text>
</svg>
