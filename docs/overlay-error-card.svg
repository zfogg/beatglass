<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc"><title id="title">Overlay actionable error card</title><desc id="desc">An error card with clear cause, retained settings, and a retry action.</desc><rect width="760" height="280" rx="22" fill="#0f172a"/><rect x="32" y="28" width="696" height="224" rx="18" fill="#1e293b" stroke="#475569"/><rect x="60" y="52" width="118" height="30" rx="15" fill="#3f1d2e" stroke="#fb7185"/><text x="83" y="72" fill="#fecdd3" font-family="sans-serif" font-size="13" font-weight="700">ACTION NEEDED</text><text x="60" y="120" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Overlay could not be restored</text><text x="60" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="14">Persisted settings are retained; reconnect or choose another display.</text><rect x="60" y="188" width="140" height="40" rx="8" fill="#be123c"/><text x="97" y="213" fill="#fff1f2" font-family="sans-serif" font-size="14" font-weight="700">Retry overlay</text></svg>
