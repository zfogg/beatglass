<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
  <title id="title">Overlay window chrome</title>
  <desc id="desc">A compact live overlay with title, ready status, tempo, key, and visualization mode.</desc>
  <rect width="760" height="330" rx="22" fill="#0f172a"/>
  <rect x="32" y="28" width="696" height="274" rx="18" fill="#111827" stroke="#475569"/>
  <text x="60" y="72" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">BEATGLASS</text><rect x="566" y="48" width="108" height="30" rx="15" fill="#163b2b" stroke="#4ade80"/><text x="620" y="63" fill="#bbf7d0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">LIVE READY</text>
  <line x1="60" y1="96" x2="700" y2="96" stroke="#334155"/>
  <text x="60" y="150" fill="#f8fafc" font-family="sans-serif" font-size="42" font-weight="700">128 BPM</text><text x="60" y="184" fill="#cbd5e1" font-family="sans-serif" font-size="18">A♭ major · I–V–vi–IV</text>
  <rect x="490" y="126" width="184" height="54" rx="12" fill="#1e293b" stroke="#60a5fa"/><text x="518" y="158" fill="#bfdbfe" font-family="sans-serif" font-size="17" font-weight="700">FFT spectrum</text>
  <text x="60" y="244" fill="#94a3b8" font-family="sans-serif" font-size="14">Output capture active · persisted settings applied</text><text x="60" y="272" fill="#64748b" font-family="sans-serif" font-size="12">Ctrl+Alt+J hide · Ctrl+Alt+W show</text>
</svg>
