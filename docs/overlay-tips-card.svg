<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / TIPS</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Make it yours</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">A few small ideas for a calmer, more useful overlay.</text>
  <rect x="112" y="258" width="466" height="144" rx="18" fill="#202938"/><text x="144" y="304" fill="#56d38b" font-family="Inter,Arial" font-size="15" letter-spacing="2">TIP 01</text><text x="144" y="344" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Try Compact mode</text><text x="144" y="378" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Keep the signal visible over your work.</text>
  <rect x="622" y="258" width="466" height="144" rx="18" fill="#202938"/><text x="654" y="304" fill="#56d38b" font-family="Inter,Arial" font-size="15" letter-spacing="2">TIP 02</text><text x="654" y="344" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Use keyboard shortcuts</text><text x="654" y="378" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Hide, unlock, and pause without reaching for menus.</text>
  <rect x="112" y="432" width="466" height="144" rx="18" fill="#202938"/><text x="144" y="478" fill="#56d38b" font-family="Inter,Arial" font-size="15" letter-spacing="2">TIP 03</text><text x="144" y="518" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Pin a favorite view</text><text x="144" y="552" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Save a layout you can return to anytime.</text>
  <rect x="622" y="432" width="466" height="144" rx="18" fill="#202938"/><text x="654" y="478" fill="#56d38b" font-family="Inter,Arial" font-size="15" letter-spacing="2">TIP 04</text><text x="654" y="518" fill="#f2f6fb" font-family="Inter,Arial" font-size="21" font-weight="700">Check diagnostics</text><text x="654" y="552" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">See output, capture, and permission health.</text>
  <rect x="112" y="620" width="168" height="54" rx="14" fill="#2a3444"/><text x="196" y="654" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Done</text><text x="1088" y="654" fill="#7f8da0" font-family="Inter,Arial" font-size="15" text-anchor="end">Show tips on startup: On</text>
</svg>
