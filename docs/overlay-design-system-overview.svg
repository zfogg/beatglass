<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Beatglass overlay design system overview</title>
  <desc id="desc">A design-system overview connecting status, settings, actions, and announcements.</desc>
  <rect width="960" height="360" rx="24" fill="#0f172a"/><text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Beatglass overlay design system</text>
  <g font-family="sans-serif" font-size="15"><rect x="48" y="96" width="190" height="110" rx="14" fill="#163b2b" stroke="#4ade80"/><text x="143" y="151" fill="#bbf7d0" font-weight="700" text-anchor="middle" dominant-baseline="middle">STATUS</text><text x="72" y="162" fill="#f8fafc">Ready · Recovery</text><text x="72" y="186" fill="#d1fae5">Disconnected</text>
  <rect x="278" y="96" width="190" height="110" rx="14" fill="#1e293b" stroke="#94a3b8"/><text x="302" y="132" fill="#cbd5e1" font-weight="700">SETTINGS</text><text x="302" y="162" fill="#f8fafc">Display · Size</text><text x="302" y="186" fill="#cbd5e1">Opacity · Interaction</text>
  <rect x="508" y="96" width="190" height="110" rx="14" fill="#172554" stroke="#60a5fa"/><text x="532" y="132" fill="#bfdbfe" font-weight="700">ACTIONS</text><text x="532" y="162" fill="#f8fafc">Review · Restore</text><text x="532" y="186" fill="#dbeafe">Retry · Unlock</text>
  <rect x="738" y="96" width="174" height="110" rx="14" fill="#3b2f12" stroke="#fbbf24"/><text x="825" y="151" fill="#fde68a" font-weight="700" text-anchor="middle" dominant-baseline="middle">ANNOUNCEMENTS</text><text x="762" y="162" fill="#fef3c7">Revision + next</text><text x="762" y="186" fill="#fef3c7">step, accessible</text></g>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M238 151h40m190 0h40m190 0h40"/><path d="m270 143 10 8-10 8m228-16 10 8-10 8m228-16 10 8-10 8"/></g>
  <text x="48" y="276" fill="#94a3b8" font-family="sans-serif" font-size="14">One state vocabulary · one retained-settings summary · one next action.</text>
  <text x="48" y="310" fill="#64748b" font-family="sans-serif" font-size="13">All states are represented in committed renderings and native screenshot qualification guidance.</text>
</svg>
