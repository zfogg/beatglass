<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#10131a"/>
  <rect x="68" y="54" width="1064" height="652" rx="28" fill="#171c26" stroke="#394557" stroke-width="2"/>
  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / LEVEL</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Audio level</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Keep an eye on the signal without chasing numbers.</text>
  <rect x="112" y="258" width="976" height="170" rx="18" fill="#202938"/><text x="144" y="304" fill="#9ba9bb" font-family="Inter,Arial" font-size="15" letter-spacing="2">CURRENT LEVEL</text><text x="144" y="370" fill="#f2f6fb" font-family="Inter,Arial" font-size="48" font-weight="700">−12 dB</text><text x="1048" y="370" fill="#56d38b" font-family="Inter,Arial" font-size="18" font-weight="700" text-anchor="end">Healthy headroom</text><rect x="144" y="395" width="900" height="12" rx="6" fill="#2a3444"/><rect x="144" y="395" width="590" height="12" rx="6" fill="#56d38b"/><text x="439" y="401" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700" text-anchor="middle" dominant-baseline="middle">Signal guidance</text><text x="112" y="520" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Green is comfortable. Amber means watch the headroom. Red means clipping risk.</text>
  <circle cx="152" cy="566" r="10" fill="#56d38b"/><text x="180" y="572" fill="#f2f6fb" font-family="Inter,Arial" font-size="17">Comfortable</text><circle cx="382" cy="566" r="10" fill="#e3b45b"/><text x="410" y="572" fill="#f2f6fb" font-family="Inter,Arial" font-size="17">Watch</text><circle cx="560" cy="566" r="10" fill="#d96d70"/><text x="588" y="572" fill="#f2f6fb" font-family="Inter,Arial" font-size="17">Clipping risk</text>
  <rect x="112" y="624" width="210" height="54" rx="14" fill="#2a3444"/><text x="217" y="658" fill="#f2f6fb" font-family="Inter,Arial" font-size="18" text-anchor="middle">Open controls</text><text x="1088" y="658" fill="#7f8da0" font-family="Inter,Arial" font-size="15" text-anchor="end">Updated live</text>
</svg>
