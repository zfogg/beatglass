  <text x="60" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="15">Selected source</text><text x="270" y="130" fill="#f8fafc" font-family="sans-serif" font-size="15">Studio Monitor</text>
  <text x="60" y="172" fill="#cbd5e1" font-family="sans-serif" font-size="15">Generation</text><text x="270" y="172" fill="#f8fafc" font-family="sans-serif" font-size="15">42 · epoch 7</text>
