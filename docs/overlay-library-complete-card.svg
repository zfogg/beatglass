  <text x="112" y="114" fill="#9ba9bb" font-family="Inter,Arial" font-size="18" letter-spacing="3">BEATGLASS / LIBRARY</text>
  <text x="112" y="174" fill="#f2f6fb" font-family="Inter,Arial" font-size="42" font-weight="700">Library is ready</text>
  <text x="112" y="211" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Your tracks are indexed and ready for analysis.</text>
  <rect x="112" y="258" width="976" height="142" rx="18" fill="#202938"/><circle cx="174" cy="329" r="38" fill="#56d38b"/><path d="M158 329l11 11 21-25" fill="none" stroke="#10131a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="318" fill="#f2f6fb" font-family="Inter,Arial" font-size="24" font-weight="700">480 tracks ready</text><text x="244" y="355" fill="#b8c4d2" font-family="Inter,Arial" font-size="17">Waveform and FFT views can open instantly.</text><text x="244" y="383" fill="#56d38b" font-family="Inter,Arial" font-size="16" font-weight="700">Overlay monitoring was not interrupted</text>
  <text x="112" y="478" fill="#f2f6fb" font-family="Inter,Arial" font-size="22" font-weight="700">Find something to play</text><text x="112" y="514" fill="#b8c4d2" font-family="Inter,Arial" font-size="16">Search the library or keep listening to your current output.</text>
