<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay opacity control</title><desc id="desc">An opacity control with a live preview, readable value, and apply action.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Overlay opacity</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Tune how much of the desktop shows through the overlay.</text><rect x="168" y="220" width="624" height="108" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">PREVIEW</text><rect x="192" y="270" width="410" height="8" rx="4" fill="#2d405e"/><rect x="192" y="270" width="308" height="8" rx="4" fill="#56d38b"/><circle cx="500" cy="274" r="12" fill="#f7fafc"/><text x="642" y="282" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">75%</text><text x="168" y="374" fill="#d8e3f5" font-family="sans-serif" font-size="16">Recommended range: 60–85%</text><text x="168" y="402" fill="#a7b4c9" font-family="sans-serif" font-size="15">Contrast remains qualified at this setting.</text><rect x="168" y="452" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="476" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Apply</text><rect x="326" y="452" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="483" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Reset</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Appearance</text></svg>
