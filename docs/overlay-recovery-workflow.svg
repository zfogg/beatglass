<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Overlay recovery workflow</title>
  <desc id="desc">Four states: ready, fallback review, restore overlay, and retry after reconnecting a display.</desc>
  <rect width="960" height="300" rx="24" fill="#111827"/>
  <text x="48" y="48" fill="#f9fafb" font-family="sans-serif" font-size="24" font-weight="700">Overlay recovery</text>
  <g font-family="sans-serif" font-size="16">
    <rect x="48" y="92" width="190" height="112" rx="16" fill="#163b2b" stroke="#4ade80" stroke-width="2"/><text x="143" y="148" fill="#bbf7d0" font-weight="700" text-anchor="middle" dominant-baseline="middle">READY</text><text x="72" y="158" fill="#f9fafb">Overlay visible</text><text x="72" y="182" fill="#d1fae5">Settings applied</text>
    <rect x="286" y="92" width="220" height="112" rx="16" fill="#3b2f12" stroke="#fbbf24" stroke-width="2"/><text x="396" y="148" fill="#fde68a" font-weight="700" text-anchor="middle" dominant-baseline="middle">FALLBACK</text><text x="310" y="158" fill="#f9fafb">Review recovery</text><text x="310" y="182" fill="#fef3c7">Settings retained</text>
    <rect x="554" y="92" width="160" height="112" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="578" y="130" fill="#bfdbfe" font-weight="700">RESTORE</text><text x="578" y="158" fill="#f9fafb">Show overlay</text><text x="578" y="182" fill="#dbeafe">Persisted state</text>
    <rect x="762" y="92" width="150" height="112" rx="16" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="786" y="130" fill="#fecdd3" font-weight="700">RETRY</text><text x="786" y="158" fill="#f9fafb">Reconnect</text><text x="786" y="182" fill="#ffe4e6">Display first</text>
  </g>
  <g stroke="#d1d5db" stroke-width="2" fill="none"><path d="M238 148h42m226 0h40m208 0h8"/><path d="m270 140 10 8-10 8m266-16 10 8-10 8m218-16 10 8-10 8"/></g>
  <text x="48" y="258" fill="#9ca3af" font-family="sans-serif" font-size="14">Native desktop screenshot qualification still required for final platform evidence.</text>
</svg>
