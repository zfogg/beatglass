<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><title>Native overlay activation retrying</title><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Retrying overlay activation</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">The native window is trying again on your saved display.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">ATTEMPT 2 OF 3</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Display 1 · saved appearance</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Your session remains available during recovery.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Playback and capture continue normally</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">Cancel to continue in safe mode.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#24344f"/><text x="239" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Recovery</text></svg>
