<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Overlay display picker</title><desc id="desc">A display selection surface that identifies the active monitor and offers a preview.</desc><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852" stroke-width="2"/><text x="168" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Choose display</text><text x="168" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">Select where the overlay should appear.</text><rect x="168" y="220" width="294" height="122" rx="14" fill="#101827" stroke="#56d38b" stroke-width="3"/><rect x="190" y="244" width="86" height="56" rx="5" fill="#24344f"/><text x="295" y="264" fill="#f7fafc" font-family="sans-serif" font-size="17" font-weight="700">Display 1</text><text x="295" y="291" fill="#7ff0c4" font-family="sans-serif" font-size="14">Selected · 2560 × 1440</text><rect x="486" y="220" width="294" height="122" rx="14" fill="#101827"/><rect x="508" y="244" width="86" height="56" rx="5" fill="#24344f"/><text x="617" y="264" fill="#f7fafc" font-family="sans-serif" font-size="17" font-weight="700">Display 2</text><text x="617" y="291" fill="#a7b4c9" font-family="sans-serif" font-size="14">1920 × 1080</text><text x="168" y="390" fill="#d8e3f5" font-family="sans-serif" font-size="16">Preview will move the overlay for verification</text><text x="168" y="418" fill="#a7b4c9" font-family="sans-serif" font-size="15">You can return to this display at any time.</text><rect x="168" y="452" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="476" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Apply</text><rect x="326" y="452" width="148" height="48" rx="12" fill="#24344f" stroke="#3b4d6d"/><text x="400" y="483" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Cancel</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Display</text></svg>
