<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><title>Native overlay permission revoked</title><rect width="960" height="600" fill="#0b1220"/><rect x="120" y="84" width="720" height="432" rx="24" fill="#172033" stroke="#2a3852"/><circle cx="184" cy="151" r="28" fill="#5b2630"/><path d="M173 140l22 22m0-22l-22 22" stroke="#ff7f86" stroke-width="5" stroke-linecap="round"/><text x="232" y="145" fill="#f7fafc" font-family="sans-serif" font-size="28" font-weight="700">Overlay permission revoked</text><text x="232" y="177" fill="#a7b4c9" font-family="sans-serif" font-size="17">The native window is paused until permission is granted again.</text><rect x="168" y="220" width="624" height="102" rx="14" fill="#101827"/><text x="192" y="253" fill="#a7b4c9" font-family="sans-serif" font-size="15">SAFE STATE</text><text x="192" y="286" fill="#f7fafc" font-family="sans-serif" font-size="22" font-weight="700">Library and audio are unaffected</text><text x="192" y="309" fill="#a7b4c9" font-family="sans-serif" font-size="14">Your saved display, theme, and layout remain available.</text><text x="168" y="372" fill="#d8e3f5" font-family="sans-serif" font-size="16">Grant permission to resume the overlay</text><text x="168" y="400" fill="#a7b4c9" font-family="sans-serif" font-size="15">You can continue playback while this is paused.</text><rect x="168" y="438" width="142" height="48" rx="12" fill="#56d38b"/><text x="239" y="462" text-anchor="middle" fill="#07130d" font-family="sans-serif" font-size="16" font-weight="700" dominant-baseline="middle">Grant access</text><rect x="326" y="438" width="148" height="48" rx="12" fill="#24344f"/><text x="400" y="469" text-anchor="middle" fill="#f7fafc" font-family="sans-serif" font-size="16">Dismiss</text><text x="168" y="548" fill="#718096" font-family="sans-serif" font-size="14">Beatglass · Native window</text></svg>
